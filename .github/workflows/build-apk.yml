name: Build APK

# 브랜치에 푸시하거나, Actions 탭에서 수동 실행(Run workflow)하면 APK를 빌드합니다.
on:
  push:
    branches:
      - claude/android-schedule-task-app-f4ygfn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 디버그 APK 빌드
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 릴리스에 APK 게시(폰에서 바로 다운로드용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: TaskFlow 최신 디버그 빌드
          body: |
            📱 **폰에 설치하는 방법**

            1. 아래 `app-debug.apk` 를 눌러 다운로드
            2. 다운로드한 파일을 눌러 설치
            3. "출처를 알 수 없는 앱" 설치 허용을 물으면 허용

            > 이 앱은 테스트용(디버그) 빌드입니다.
          files: app/build/outputs/apk/debug/app-debug.apk
